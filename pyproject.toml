[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# The classic pyflakes/pycodestyle-error set: syntax errors, undefined names,
# unused imports, comparison mistakes. Ruff's wider default set is style
# preference, and this repo should not fail CI over import ordering.
# Selecting explicitly also keeps the check deterministic across ruff releases.
select = ["E4", "E7", "E9", "F"]
